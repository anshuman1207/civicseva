<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicSeva Admin Dashboard</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      .admin-layout {
        display: flex;
        height: calc(100vh - 60px);
      }
      .admin-sidebar {
        width: 350px;
        background: #F9FAFB;
        border-right: 1px solid #E5E7EB;
        overflow-y: auto;
        padding: 1rem;
      }
      .admin-map-container {
        flex: 1;
      }
      .complaint-card {
        background: white;
        border: 1px solid #E5E7EB;
        padding: 1rem;
        margin-bottom: 1rem;
        border-radius: 0.375rem;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      }
      .complaint-card h4 {
        margin: 0 0 0.5rem 0;
      }
      .complaint-card select {
        padding: 4px;
        border-radius: 4px;
        margin-top: 10px;
        width: 100%;
        border: 1px solid #D1D5DB;
      }
    </style>
  </head>
  <body>
    <header class="app-header" style="background: #111827; color: white;">
      <div class="logo">
        <h1 style="color: white;">Civic<span style="color: #4F46E5;">Seva</span> <small>Admin</small></h1>
      </div>
    </header>

    <div class="admin-layout">
      <!-- List View -->
      <div class="admin-sidebar" id="admin-list">
        <h3>Live Complaints</h3>
        <small>Fetching data...</small>
      </div>

      <!-- Map View -->
      <div class="admin-map-container" id="admin-map"></div>
    </div>

    <!-- Notification Container -->
    <div id="notification-container" class="notification-container"></div>

    <!-- Leaflet & Socket.io JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script type="module" src="./admin.js"></script>
  </body>
</html>
