<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicSeva - Fixing Kolkata</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="./style.css">
    <!-- Google Fonts for better aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <header class="app-header">
      <div class="logo">
        <h1>Civic<span>Seva</span></h1>
      </div>
      <button id="report-btn" class="primary-btn">Report Issue</button>
    </header>

    <main class="app-main">
      <div id="map"></div>
    </main>

    <!-- Reporting Modal (Hidden by default) -->
    <div id="report-modal" class="modal hidden">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Report a Civic Issue</h2>
        <p class="subtitle">Your report helps authorities clear the problem faster.</p>
        
        <form id="complaint-form" enctype="multipart/form-data">
          <!-- Coordinates will be auto-filled from map click -->
          <input type="hidden" id="lat" name="latitude">
          <input type="hidden" id="lng" name="longitude">

          <div class="form-group">
            <label for="title">Issue Title</label>
            <input type="text" id="title" name="title" required placeholder="e.g. Deep pothole on MG Road">
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="Roads">Roads</option>
              <option value="Garbage">Garbage</option>
              <option value="Water">Water</option>
              <option value="Electricity">Electricity</option>
              <option value="Others">Others</option>
            </select>
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" required placeholder="Provide more details..."></textarea>
          </div>

          <div class="form-group file-upload-wrapper">
            <label for="photo">Upload Photo</label>
            <input type="file" id="photo" name="photo" accept="image/*">
            <small>Optional, but highly recommended for faster resolution.</small>
          </div>

          <button type="submit" class="primary-btn full-width">Submit Report</button>
        </form>
      </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
